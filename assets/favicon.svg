<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img">
<title>JamWare Audio</title>
<desc>The JamWare Audio mark: a row of step-sequencer blocks mutating into a smooth acid-squelch waveform, on a faceplate-cream tile.</desc>
<!-- A square derivative of assets/logo.svg, and it exists because that file is
     420x230. A wide mark dropped into a square favicon slot letterboxes to
     roughly half height, which at 16px is a grey smudge. Here the artwork is
     scaled and centred on a cream tile of the same faceplate colour the site and
     the apps use, so the tab reads as a small badge rather than a stray line.

     The geometry is the logo's own, translated and scaled, not redrawn: keep it
     that way. The canonical palette is documented at length in assets/logo.svg
     and is shared by the app headers, the manual covers and the app icons -
     step run #2a2621, step dots #e0862c, squelch tail #d13a2c. Change one,
     change all of them, and this file is now one of them.

     As in that file: no literal double-hyphen anywhere in an XML comment. -->
<rect width="512" height="512" rx="96" fill="#efe9df"/>
<g transform="translate(256 256) scale(0.92) translate(-262 -196)">
  <path d="M76,256 V226 H112 V196 H148 V236 H184 V186 H220 V216 H256 V176 H292"
    fill="none" stroke="#2a2621" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="76" cy="256" r="8" fill="#e0862c"/>
  <circle cx="112" cy="226" r="8" fill="#e0862c"/>
  <circle cx="148" cy="196" r="8" fill="#e0862c"/>
  <circle cx="184" cy="236" r="8" fill="#e0862c"/>
  <circle cx="220" cy="186" r="8" fill="#e0862c"/>
  <circle cx="256" cy="216" r="8" fill="#e0862c"/>
  <circle cx="292" cy="176" r="8" fill="#e0862c"/>
  <path d="M292,176 C316,120 340,110 364,166 C388,222 396,300 424,268 C440,250 448,250 456,256"
    fill="none" stroke="#d13a2c" stroke-width="18" stroke-linecap="round"/>
</g>
</svg>
